# Configurazione autonoma: non combinarla con compose.yaml.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Impostare DATABASE_URL per Supabase}
      DB_SCHEMA: collettori
      OFFLINE_HOURS: ${OFFLINE_HOURS:-72}
    # Schema predisposto mediante SQL; il ruolo runtime non esegue DDL.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - files:/srv/runtime
      - ./demo:/srv/demo:ro
volumes:
  files:
